[package]
name = "zilch"
version = "0.2.0"
edition = "2024"

[profile.release]
strip = true

[dependencies]
adb_client = { version = "2.1.18" }
# TODO: drop x11 support when wayland adoption increases. Will decrease binary size
eframe = {version = "0.36.2", features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.36.2"
egui_alignments = "0.3.9"
egui_extras = "0.36.2"
env_logger = "0.11.8"
log = "0.4.29"
phf = { version = "0.13.1", features = ["macros"] }
rfd = { version = "0.17.2", features = ["pollster", "wayland", "xdg-portal"] }
rusb = "0.9.4"
